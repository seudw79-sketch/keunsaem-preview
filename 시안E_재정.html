async function unlock(){

  document.getElementById("err").textContent="";
  try{
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2a(SALT),iterations:200000,hash:"SHA-256"},

    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},key,b2a(CT));

  }catch(e){document.getElementById("err").textContent="암호가 맞지 않습니다";}
}
