<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>설교 프롬프터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0D0F0E;
    --panel:#161A18;
    --panel-2:#1E2321;
    --line:#2B312E;
    --ink:#F2EFE9;
    --muted:#8B938E;
    --accent:#E8A33D;
    --accent-dim:#8A6425;
    --spoken:#5F6865;
    --ui:"Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme:dark;
  }
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .setup{min-height:100%;display:flex;flex-direction:column;gap:22px;padding-block:28px 40px;padding-inline:20px;max-width:880px;margin:0 auto}
  .masthead{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}
  h1{font-size:23px;font-weight:700;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin:0}

  .warn{background:rgba(232,163,61,.13);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;font-size:13.5px;line-height:1.65;color:#F6D9A8}
  .warn b{color:#FFE9C4}
  .check{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .check .sub{font-size:12.5px}
  .ok{color:#8FD49B}.bad{color:#F09B8E}
  .field{display:flex;flex-direction:column;gap:9px}
  .flabel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .flabel .name{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .flabel .right{display:flex;align-items:center;gap:12px}
  .count{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .filebtn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px;color:var(--muted)}
  textarea{width:100%;min-height:220px;resize:vertical;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px;font-family:var(--ui);font-size:16px;line-height:1.85}
  textarea::placeholder{color:#5D645F}

  .dials{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
  .dial{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
  .dial .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .dial .name{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .dial .val{font-family:var(--mono);font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent);background:transparent}

  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:12px}
  .mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:5px}
  .mode[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,rgba(232,163,61,.14),rgba(232,163,61,.04))}
  .mode .t{font-size:15px;font-weight:700}
  .mode .d{font-size:12.5px;color:var(--muted);line-height:1.5}
  .mode:disabled{opacity:.45;cursor:not-allowed}

  .toggles{display:flex;flex-wrap:wrap;gap:9px}
  .toggle{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:9px 15px;font-size:13px}
  .toggle[aria-pressed="true"]{background:var(--accent-dim);border-color:var(--accent);color:#FFF4E2}

  .adv{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .adv>summary{list-style:none;cursor:pointer;padding:15px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .adv>summary::-webkit-details-marker{display:none}
  .adv>summary::after{content:"펼치기";font-size:12px;font-weight:400;color:var(--muted)}
  .adv[open]>summary::after{content:"접기"}
  .adv .inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
  .adv .inner>*:first-child{margin-top:14px}

  .startbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(13,15,14,.96);border-top:1px solid var(--line);
    padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
  .startbar .go{flex:1;padding:16px 20px}
  .startbar .meta{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.45;max-width:46%}
  .startbar .meta b{color:var(--ink);font-weight:500}
  .setup{padding-bottom:104px}

  .launch{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:2px}
  .go{background:var(--accent);color:#1A1206;border:0;border-radius:10px;padding:15px 30px;font-size:16px;font-weight:700}
  .go:active{transform:translateY(1px)}
  .estimate{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .estimate b{color:var(--ink);font-weight:500}

  .keys{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;gap:7px 22px}
  .keys p{margin:0;font-size:12.5px;color:var(--muted)}
  kbd{font-family:var(--mono);font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--ink)}

  .stage{position:fixed;inset:0;background:#000;display:flex;flex-direction:column}
  .viewport{position:relative;flex:1;overflow:hidden;touch-action:none}
  .cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .cam.selfie{transform:scaleX(-1)}
  .scrim{position:absolute;inset:0;background:#000;opacity:.55;pointer-events:none}
  .scroller{position:absolute;left:0;right:0;top:0;will-change:transform;padding-inline:6vw;font-weight:500;color:var(--ink);white-space:pre-wrap;word-break:keep-all;text-shadow:0 2px 14px rgba(0,0,0,.85)}
  .rec{display:inline-flex;align-items:center;gap:7px}
  .rec .dot{width:10px;height:10px;border-radius:50%;background:#E05B4B}
  .bar button.recording{background:#E05B4B;border-color:#E05B4B;color:#1A0906;font-weight:700}
  .saveline{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;background:rgba(13,15,14,.96);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}
  .saveline a{color:var(--accent);font-weight:700}
  .scroller w{display:inline;transition:color .18s}
  .scroller w.past{color:var(--spoken)}
  .scroller w.now{color:var(--accent)}
  .guide{position:absolute;left:0;right:0;pointer-events:none;border-top:2px solid var(--accent);opacity:.5}
  .guide::before,.guide::after{content:"";position:absolute;top:-9px;border:8px solid transparent;border-top-color:var(--accent)}
  .guide::before{left:0}.guide::after{right:0}

  .more{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(13,15,14,.94);border-top:1px solid var(--line);padding:10px 16px}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(13,15,14,.94);border-top:1px solid var(--line);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .bar button{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:11px 16px;font-size:14px;min-width:52px}
  .bar .primary{background:var(--accent);color:#1A1206;border-color:var(--accent);font-weight:700;min-width:96px}
  .clock{margin-left:auto;display:flex;align-items:baseline;gap:12px;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .diag{background:rgba(13,15,14,.94);border-top:1px solid var(--line);padding:4px 16px 6px;font-size:10.5px;color:var(--muted);font-family:var(--mono);white-space:normal;word-break:break-all}
  .clock .elapsed{font-size:17px}
  .clock .left{font-size:13px;color:var(--muted)}
  .micdot{width:9px;height:9px;border-radius:50%;background:#4B534F}
  .micdot.live{background:var(--accent);box-shadow:0 0 0 0 rgba(232,163,61,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 9px rgba(232,163,61,0)}100%{box-shadow:0 0 0 0 rgba(232,163,61,0)}}
  @media (prefers-reduced-motion:reduce){.micdot.live{animation:none}}

  .countdown{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.72);font-family:var(--mono);font-size:19vmin;color:var(--accent)}
  .notice{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;background:rgba(232,163,61,.14);color:#F6D9A8;font-size:13px;text-align:center}
  @media (max-width:430px){
    .bar button{padding:10px 12px;min-width:46px;font-size:13px}
    .bar .primary{min-width:78px}
  }
</style>
</head>
<body>
<main class="setup" id="setup">
  <header class="masthead">
    <div>
      <h1>설교 프롬프터</h1>
      <p class="sub">원고를 넣고 읽으면 됩니다. 설치도 로그인도 없습니다.</p>
    </div>
    <p class="sub" id="savedNote" aria-live="polite"></p>
  </header>

  <div class="warn" id="warn" hidden></div>

  <div class="check">
    <button class="filebtn" id="selftest" type="button">카메라·마이크 점검</button>
    <span id="checkResult" class="sub"></span>
  </div>

  <div class="field">
    <div class="flabel">
      <span class="name">원고</span>
      <span class="right">
        <span class="count" id="charCount">0자</span>
        <button class="filebtn" id="pickFile" type="button">원고 파일 불러오기 (워드·텍스트)</button>
      </span>
    </div>
    <textarea id="script" placeholder="원고를 붙여넣으세요. 빈 줄은 그대로 사이가 벌어집니다."></textarea>
    <input type="file" id="fileInput" accept=".txt,.md,.docx,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
  </div>

  <div class="modes">
    <button class="mode" id="modeVoice" aria-pressed="false" type="button">
      <span class="t">내가 말하면 따라옴</span>
      <span class="d">마이크로 듣고 읽은 데까지 따라옵니다. 쉬면 같이 멈춥니다.</span>
    </button>
    <button class="mode" id="modeAuto" aria-pressed="true" type="button">
      <span class="t">정해진 속도로 올라감</span>
      <span class="d">일정한 속도로 올라갑니다. 읽는 중에도 느리게·빠르게로 바꿉니다.</span>
    </button>
  </div>

  <div class="toggles" style="margin-top:-8px">
    <button class="toggle" id="camOn" aria-pressed="false" type="button">카메라 켜고 보기</button>
  </div>

  <details class="adv" id="adv">
    <summary>세부 설정 — 글자 크기, 속도, 카메라</summary>
    <div class="inner">
      <div class="dials">
        <div class="dial">
          <div class="top"><span class="name">글자 크기</span><span class="val" id="sizeVal">52px</span></div>
          <input type="range" id="size" min="24" max="110" step="2" value="52" aria-label="글자 크기">
        </div>
        <div class="dial">
          <div class="top"><span class="name">읽기 속도</span><span class="val" id="speedVal">5</span></div>
          <input type="range" id="speed" min="1" max="15" step="1" value="5" aria-label="읽기 속도">
        </div>
        <div class="dial">
          <div class="top"><span class="name">줄 간격</span><span class="val" id="leadVal">1.7</span></div>
          <input type="range" id="lead" min="12" max="26" step="1" value="17" aria-label="줄 간격">
        </div>
        <div class="dial">
          <div class="top"><span class="name">기준선 위치</span><span class="val" id="guideVal">40%</span></div>
          <input type="range" id="guide" min="15" max="75" step="5" value="40" aria-label="기준선 위치">
        </div>
        <div class="dial">
          <div class="top"><span class="name">카메라 위 가림막</span><span class="val" id="scrimVal">30%</span></div>
          <input type="range" id="scrim" min="0" max="90" step="5" value="30" aria-label="카메라 위 가림막">
        </div>
      </div>

          <div class="toggles">
        <button class="toggle" id="camBack" aria-pressed="false" type="button">후면 카메라</button>
        <button class="toggle" id="mirrorX" aria-pressed="false" type="button">좌우 반전</button>
        <button class="toggle" id="mirrorY" aria-pressed="false" type="button">상하 반전</button>
        <button class="toggle" id="countIn" aria-pressed="true" type="button">3초 카운트</button>
        <button class="toggle" id="keepAwake" aria-pressed="true" type="button">화면 꺼짐 방지</button>
      </div>

          

    </div>
  </details>

  <div class="keys">
    <p><kbd>space</kbd> 시작 · 멈춤</p>
    <p><kbd>↑</kbd><kbd>↓</kbd> 속도</p>
    <p><kbd>←</kbd><kbd>→</kbd> 10초 앞뒤</p>
    <p><kbd>R</kbd> 처음으로</p>
    <p><kbd>esc</kbd> 원고로</p>
    <p>화면을 손으로 끌어 위치를 옮길 수 있습니다.</p>
  </div>

  <div class="startbar">
    <button class="go" id="start" type="button">읽기 시작</button>
    <div class="meta">
      <span id="modeNow">지금 선택 — <b>일정 속도</b></span><br>
      <span id="estimate"></span>
    </div>
  </div>
</main>

<section class="stage" id="stage" hidden>
  <div class="viewport" id="viewport">
    <video class="cam" id="cam" playsinline muted autoplay hidden></video>
    <div class="scrim" id="scrimLayer" hidden></div>
    <div class="scroller" id="scroller"></div>
    <div class="guide" id="guideLine"></div>
    <div class="countdown" id="countdown" hidden>3</div>
    <div class="notice" id="notice" hidden></div>
    <div class="saveline" id="saveline" hidden></div>
  </div>
  <div class="more" id="moreRow" hidden>
    <button id="modeToggle" type="button">모드: 속도</button>
    <button id="restart" type="button">처음으로</button>
    <button id="camToggle" type="button">카메라</button>
    <button id="flip" type="button" hidden>앞뒤</button>
    <button id="diagToggle" type="button" aria-pressed="false">진단 보기</button>
  </div>
  <div class="bar" id="bar">
    <button class="primary" id="playPause" type="button">시작</button>
    <button id="slower" type="button" aria-label="느리게">속도 −</button>
    <button id="faster" type="button" aria-label="빠르게">속도 +</button>
    <button id="brighter" type="button">밝기 +</button>
    <button id="darker" type="button">밝기 −</button>
    <button id="record" type="button" hidden>녹화</button>
    <button id="moreBtn" type="button">더보기</button>
    <button id="exit" type="button">끝내기</button>
    <div class="clock">
      <span class="micdot" id="micdot" title="마이크"></span>
      <span class="elapsed" id="elapsed">0:00</span>
      <span class="left" id="left">남은 시간 —</span>
    </div>
  </div>
  <div class="diag" id="diagLine" hidden></div>
</section>

<script>
(function(){
  var SAMPLE = "여러분, 무거운 말뚝을 옮기는 사람이\n법궤를 메는 사람을 부러워하며 자리를 벗어나면 어떻게 되겠습니까.\n\n온 진영의 질서가 다 깨지게 되는 거죠.\n보이지 않는 작은 말뚝 하나라도 내 몫을 묵묵히 감당하는 것이\n광야를 걷는 성도의 질서인 겁니다.\n\n밖을 내다보면 우리 교회만 작은 것 같고\n다 큰 교회인 것 같지만 그렇지 않아요.\n\n따져보면 대형교회는 얼마 되지 않아요.\n수많은 개척교회, 수많은 미자립교회,\n또 수많은 소형 중형교회들이 같이 있는 거예요.";

  var KEY = "sermon-prompter-v1";
  var $ = function(id){ return document.getElementById(id); };
  var setup=$("setup"), stage=$("stage"), scroller=$("scroller"), viewport=$("viewport");
  var script=$("script"), guideLine=$("guideLine"), countdown=$("countdown"), notice=$("notice");

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var voiceSupported = !!SR;

  var state = { size:52, speed:5, lead:17, guide:40, mirrorX:false, mirrorY:false,
                countIn:true, keepAwake:true, mode:"auto", text:"",
                camOn:false, camBack:false, scrim:30 };

  function load(){
    try{ var raw=localStorage.getItem(KEY); if(raw){ var s=JSON.parse(raw); for(var k in state){ if(k in s) state[k]=s[k]; } } }catch(e){}
    if(!state.text) state.text = SAMPLE;
    if(!voiceSupported) state.mode = "auto";
  }
  var noteTimer;
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
      var el=$("savedNote"); el.textContent="이 기기에 저장됨";
      clearTimeout(noteTimer); noteTimer=setTimeout(function(){ el.textContent=""; },1600);
    }catch(e){}
  }

  function pxPerSec(){ return state.speed * state.size * 0.062; }
  function stamp(){
    var d = new Date(), z = function(n){ return (n<10?"0":"")+n; };
    return d.getFullYear() + z(d.getMonth()+1) + z(d.getDate()) + "_" + z(d.getHours()) + z(d.getMinutes());
  }
  function fmt(sec){
    if(!isFinite(sec)||sec<0) sec=0;
    var m=Math.floor(sec/60), s=Math.round(sec%60);
    if(s===60){ m+=1; s=0; }
    return m+":"+(s<10?"0"+s:s);
  }

  /* ---------- 편집 화면 ---------- */
  function syncSetupUI(){
    script.value = state.text;
    $("size").value=state.size;  $("sizeVal").textContent=state.size+"px";
    $("speed").value=state.speed; $("speedVal").textContent=state.speed;
    $("lead").value=state.lead;  $("leadVal").textContent=(state.lead/10).toFixed(1);
    $("guide").value=state.guide; $("guideVal").textContent=state.guide+"%";
    $("scrim").value=state.scrim; $("scrimVal").textContent=state.scrim+"%";
    ["mirrorX","mirrorY","countIn","keepAwake","camOn","camBack"].forEach(function(id){ $(id).setAttribute("aria-pressed", String(state[id])); });
    $("modeVoice").setAttribute("aria-pressed", String(state.mode==="voice"));
    $("modeAuto").setAttribute("aria-pressed", String(state.mode==="auto"));
    if(!voiceSupported){
      $("modeVoice").disabled = true;
      $("modeVoice").querySelector(".d").textContent = "이 브라우저는 음성 인식을 지원하지 않습니다. 크롬이나 사파리에서 열어 보세요.";
    }
    updateCounts();
  }

  var probe;
  function estimateSeconds(text){
    if(!text.trim()) return 0;
    if(!probe){
      probe=document.createElement("div");
      probe.style.cssText="position:absolute;visibility:hidden;left:-9999px;top:0;white-space:pre-wrap;word-break:keep-all;";
      document.body.appendChild(probe);
    }
    probe.style.width = Math.max(320,(window.innerWidth||900)*0.88)+"px";
    probe.style.fontSize = state.size+"px";
    probe.style.lineHeight = (state.lead/10);
    probe.style.fontFamily = getComputedStyle(document.body).fontFamily;
    probe.style.fontWeight = "500";
    probe.textContent = text;
    return (probe.offsetHeight + (window.innerHeight||700)*0.5) / pxPerSec();
  }
  function updateCounts(){
    var n = script.value.replace(/\s/g,"").length;
    $("charCount").textContent = n.toLocaleString("ko-KR")+"자";
    if(state.mode==="voice"){
      $("estimate").innerHTML = "말하는 속도에 맞춰 따라갑니다";
    }else{
      var est = estimateSeconds(script.value);
      $("estimate").innerHTML = est ? ("이 속도로 <b>"+fmt(est)+"</b> 걸립니다") : "";
    }
  }

  /* ---------- 읽기 ---------- */
  var running=false, offset=0, target=0, last=0, raf=0, accum=0, wakeLock=null;
  var words=[], cursor=-1, rec=null, recActive=false, lastHeard=0;
  var recSessions=0, lastToks=[], diagOn=false, diagTimer=0, onendCount=0, lastErrorName="";
  var reviving=false, reviveCount=0;

  function buildWords(text){
    scroller.textContent = "";
    words = [];
    var lines = text.split("\n");
    lines.forEach(function(line, li){
      var parts = line.split(/(\s+)/);
      parts.forEach(function(p){
        if(!p) return;
        if(/^\s+$/.test(p)){ scroller.appendChild(document.createTextNode(p)); return; }
        var w = document.createElement("w");
        w.textContent = p;
        scroller.appendChild(w);
        words.push({ el:w, key:norm(p), top:0 });
      });
      if(li < lines.length-1) scroller.appendChild(document.createTextNode("\n"));
    });
    measure();
  }
  function norm(s){ return s.replace(/[^0-9A-Za-z가-힣]/g,""); }
  function measure(){
    for(var i=0;i<words.length;i++){ words[i].top = words[i].el.offsetTop; }
  }

  function applyStageStyle(){
    scroller.style.fontSize = state.size+"px";
    scroller.style.lineHeight = (state.lead/10);
    guideLine.style.top = state.guide+"%";
    viewport.style.transform = "scale("+(state.mirrorX?-1:1)+","+(state.mirrorY?-1:1)+")";
  }
  function place(){ scroller.style.transform = "translateY("+(-offset)+"px)"; }
  function totalDistance(){ return scroller.offsetHeight + viewport.offsetHeight*0.5; }
  function guidePx(){ return viewport.offsetHeight * (state.guide/100); }

  function tick(ts){
    if(!running) return;
    if(!last) last = ts;
    var dt = (ts-last)/1000; last = ts;
    if(dt > 0.5) dt = 0.5;
    accum += dt;

    if(state.mode === "voice"){
      if(recActive && running && lastHeard && (performance.now() - lastHeard) > 6000){
        reviveRec();
      }
      var d = target - offset;
      if(Math.abs(d) > 0.5){
        var step = d * Math.min(1, dt*4.5);
        var cap = pxPerSec() * 4 * dt;
        if(Math.abs(step) > cap) step = (step>0?1:-1)*cap;
        offset += step;
      }
    }else{
      offset += pxPerSec()*dt;
      var max = totalDistance();
      if(offset >= max){ offset = max; pause(); }
    }
    place(); updateClock();
    raf = requestAnimationFrame(tick);
  }

  function updateClock(){
    $("elapsed").textContent = fmt(accum);
    if(state.mode === "voice"){
      var done = words.length ? Math.max(0, cursor+1) : 0;
      $("left").textContent = words.length ? ("원고 "+Math.round(done/words.length*100)+"%") : "원고 —";
    }else{
      $("left").textContent = "남은 시간 " + fmt((totalDistance()-offset)/pxPerSec());
    }
  }

  function play(){
    if(running) return;
    running = true; last = 0;
    $("playPause").textContent = "멈춤";
    raf = requestAnimationFrame(tick);
    requestWake();
    if(state.mode === "voice"){
      if(camStream) showNotice("카메라가 켜져 있어 마이크를 녹화가 함께 씁니다. 음성 따라가기가 끊기면 카메라를 끄고 해 보세요.");
      startRec();
    }
  }
  function pause(){
    running = false; cancelAnimationFrame(raf); last = 0;
    $("playPause").textContent = "시작";
    stopRec();
  }

  function requestWake(){
    if(!state.keepAwake || wakeLock) return;
    try{
      if(navigator.wakeLock && navigator.wakeLock.request){
        navigator.wakeLock.request("screen").then(function(w){
          wakeLock = w; w.addEventListener("release", function(){ wakeLock=null; });
        }).catch(function(){});
      }
    }catch(e){}
  }
  function releaseWake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }

  /* ---------- 음성 따라가기 ---------- */
  var CONTINUOUS = false; /* iOS 사파리 대응(가설 F) — 출처 조사 중, 되돌릴 땐 이 값만 true로 */
  function makeRec(){
    var r = new SR();
    r.lang = "ko-KR";
    r.continuous = CONTINUOUS;
    r.interimResults = true;
    r.onresult = onHeard;
    r.onerror = function(e){
      var code = e && e.error;
      lastErrorName = code || "";
      if(code === "not-allowed" || code === "service-not-allowed"){
        showNotice("마이크를 쓸 수 없어 일정 속도로 바꿨습니다. 브라우저 주소창의 마이크 권한을 허용해 주세요.");
        state.mode = "auto"; recActive = false; $("micdot").classList.remove("live");
      }else if(code === "audio-capture"){
        stick("녹화가 마이크를 쓰고 있어 음성 따라가기가 멈췄습니다. 카메라를 끄고 음성 모드로 하시거나, 녹화하실 때는 속도 모드를 쓰세요.");
      }else if(code === "no-speech" || code === "aborted"){
        /* 조용히 넘긴다 — 재시작은 onend 가 한다. state.mode 는 바꾸지 않는다. */
      }else{
        stick("음성 인식 오류: " + code);
      }
    };
    r.onend = function(){
      onendCount++;
      $("micdot").classList.remove("live");
      if(recActive && running){
        setTimeout(function(){
          if(!(recActive && running)) return;
          try{
            rec = makeRec(); rec.start();
            lastHeard = performance.now(); recSessions++;
            $("micdot").classList.add("live");
          }catch(e){
            setTimeout(function(){
              if(!(recActive && running)) return;
              try{
                rec = makeRec(); rec.start();
                lastHeard = performance.now(); recSessions++;
                $("micdot").classList.add("live");
              }catch(e2){}
            }, 600);
          }
        }, 250);
      }
    };
    return r;
  }
  function startRec(){
    if(!voiceSupported || recActive) return;
    recActive = true;
    try{
      rec = makeRec(); rec.start();
      lastHeard = performance.now(); recSessions++;
      $("micdot").classList.add("live");
    }catch(e){
      showNotice("음성 인식을 시작하지 못했습니다. 일정 속도로 읽습니다.");
      state.mode = "auto"; recActive = false;
    }
  }
  /* 애플 음성인식은 세션당 약 1분 제한이 보고된다. */
  /* 3~5초 침묵이면 조기 종료된다 — 그래서 끊김은 정상이고, 끊긴 뒤 다시 거는 것이 설계의 핵심이다. */
  function reviveRec(){
    if(reviving) return;
    reviving = true;
    try{ if(rec) rec.abort(); }catch(e){}
    rec = null;
    setTimeout(function(){
      if(!(state.mode === "voice" && recActive && running)){ reviving = false; return; }
      try{
        rec = makeRec(); rec.start();
        recSessions++; reviveCount++; lastHeard = performance.now();
        reviving = false;
        if(reviveCount === 4) showNotice("아이폰 음성인식이 자꾸 끊깁니다. 속도 모드로 바꾸시면 안정적입니다.");
      }catch(e){
        setTimeout(function(){
          if(!(state.mode === "voice" && recActive && running)){ reviving = false; return; }
          try{
            rec = makeRec(); rec.start();
            recSessions++; reviveCount++; lastHeard = performance.now();
            if(reviveCount === 4) showNotice("아이폰 음성인식이 자꾸 끊깁니다. 속도 모드로 바꾸시면 안정적입니다.");
          }catch(e2){}
          reviving = false;
        }, 1000);
      }
    }, 300);
  }
  function stopRec(){
    recActive = false;
    $("micdot").classList.remove("live");
    try{ if(rec) rec.stop(); }catch(e){}
  }

  function onHeard(ev){
    var heard = "";
    for(var i=ev.resultIndex;i<ev.results.length;i++){ heard += ev.results[i][0].transcript + " "; }
    var toks = heard.split(/\s+/).map(norm).filter(Boolean);
    if(!toks.length) return;
    lastHeard = performance.now();
    lastToks = lastToks.concat(toks).slice(-3);

    var searchFrom = cursor + 1;
    var searchTo = Math.min(words.length, searchFrom + 60);
    var moved = false;

    for(var t=0;t<toks.length;t++){
      var tok = toks[t];
      if(tok.length < 2) continue;
      for(var w=searchFrom; w<searchTo; w++){
        var key = words[w].key;
        if(!key) continue;
        if(key === tok || key.indexOf(tok) === 0 || tok.indexOf(key) === 0){
          markUpTo(w);
          searchFrom = w + 1;
          searchTo = Math.min(words.length, searchFrom + 60);
          moved = true;
          break;
        }
      }
    }
    if(moved) aimAtCursor();
  }

  function markUpTo(i){
    for(var k=Math.max(0,cursor); k<=i; k++){
      if(k>=0 && words[k]){ words[k].el.classList.add("past"); words[k].el.classList.remove("now"); }
    }
    cursor = i;
    if(words[cursor]){ words[cursor].el.classList.add("now"); words[cursor].el.classList.remove("past"); }
  }
  function aimAtCursor(){
    if(cursor < 0 || !words[cursor]) return;
    target = Math.max(0, words[cursor].top - guidePx());
  }

  function showNotice(msg){
    notice.textContent = msg; notice.hidden = false;
    setTimeout(function(){ notice.hidden = true; }, 6000);
  }
  function stick(msg){ notice.textContent = msg; notice.hidden = false; }

  /* ---------- 카메라 ---------- */
  var camStream=null, mediaRec=null, chunks=[], recStart=0;
  var camEl=$("cam"), scrimLayer=$("scrimLayer"), saveline=$("saveline");

  function applyScrim(){
    scrimLayer.style.opacity = (state.scrim/100);
    scrimLayer.hidden = !state.camOn;
  }

  function inApp(){
    var ua = navigator.userAgent || "";
    return /FBAN|FBAV|Instagram|Line\/|KAKAOTALK|Telegram|NAVER|DaumApps|Twitter/i.test(ua);
  }
  function startCam(){
    if(camStream) return Promise.resolve();
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      stick(inApp()
        ? "앱 안에서 열면 카메라가 막힙니다. 공유 버튼을 눌러 사파리(또는 크롬)로 열어 주세요."
        : "이 브라우저에서는 카메라를 쓸 수 없습니다. 사파리나 크롬에서 열어 주세요.");
      state.camOn = false; applyScrim();
      return Promise.reject();
    }
    var want = { video:{ facingMode: state.camBack ? "environment" : "user", width:{ideal:1920}, height:{ideal:1080} }, audio:true };
    return navigator.mediaDevices.getUserMedia(want).then(function(s){
      camStream = s;
      camEl.srcObject = s;
      camEl.hidden = false;
      camEl.classList.toggle("selfie", !state.camBack);
      applyScrim();
      $("flip").hidden = false;
      $("record").hidden = !recSupported();
      showNotice(recSupported() ? "카메라가 켜졌습니다. 아래 녹화 버튼으로 찍을 수 있습니다." : "카메라가 켜졌습니다. 이 기기에서는 녹화가 지원되지 않습니다.");
      return camEl.play().catch(function(){});
    }).catch(function(err){
      state.camOn = false; applyScrim();
      showNotice("카메라를 쓸 수 없습니다. 브라우저에서 카메라 권한을 허용해 주세요.");
      throw err;
    });
  }

  function stopCam(){
    stopRecording();
    if(camStream){ camStream.getTracks().forEach(function(t){ t.stop(); }); camStream = null; }
    camEl.srcObject = null; camEl.hidden = true;
    scrimLayer.hidden = true;
    $("flip").hidden = true; $("record").hidden = true;
  }

  function flipCam(){
    state.camBack = !state.camBack;
    $("camBack").setAttribute("aria-pressed", String(state.camBack));
    save();
    if(!camStream) return;
    var wasRecording = !!(mediaRec && mediaRec.state === "recording");
    stopCam();
    state.camOn = true;
    startCam().then(function(){ if(wasRecording) startRecording(); }).catch(function(){});
  }

  function recSupported(){
    return typeof MediaRecorder !== "undefined";
  }
  function pickMime(){
    var want = ["video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
    for(var i=0;i<want.length;i++){
      try{ if(MediaRecorder.isTypeSupported(want[i])) return want[i]; }catch(e){}
    }
    return "";
  }
  function startRecording(){
    if(!camStream || !recSupported()) return;
    if(mediaRec && mediaRec.state === "recording") return;
    try{
      var mime = pickMime();
      mediaRec = mime ? new MediaRecorder(camStream, { mimeType: mime }) : new MediaRecorder(camStream);
      chunks = [];
      mediaRec.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      mediaRec.onstop = function(){
        var type = (mediaRec && mediaRec.mimeType) || "video/mp4";
        var blob = new Blob(chunks, { type:type });
        var ext = type.indexOf("mp4") >= 0 ? "mp4" : "webm";
        var sizeLabel = blob.size < 1048576 ? (Math.round(blob.size/1024) + "KB") : ((blob.size/1048576).toFixed(1) + "MB");
        if(!blob.size){
          stick("녹화된 내용이 없습니다. 카메라를 켜고 녹화를 누른 뒤 몇 초 기다렸다가 멈춰 주세요.");
          return;
        }
        var fname = "설교프롬프터_" + stamp() + "." + ext;
        var file = null;
        try{ file = new File([blob], fname, { type:type }); }catch(e){}
        var canShare = !!(file && navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share);

        saveline.innerHTML = "";
        var label = document.createElement("span");
        label.textContent = "녹화 " + fmt((performance.now()-recStart)/1000) + " · " + sizeLabel;
        label.style.color = "var(--muted)";
        saveline.appendChild(label);

        if(canShare){
          var hint = document.createElement("span");
          hint.textContent = "공유창이 뜨면 아래쪽 [비디오 저장] 을 누르셔야 사진첩에 들어갑니다.";
          hint.style.cssText = "flex:1 0 100%;color:var(--muted);font-size:11.5px;white-space:normal";
          saveline.appendChild(hint);

          var sb = document.createElement("button");
          sb.type = "button"; sb.textContent = "사진첩에 저장 (공유창 → 비디오 저장)";
          sb.style.cssText = "background:var(--accent);color:#1A1206;border:0;border-radius:9px;padding:11px 18px;font-weight:700";
          sb.onclick = function(){
            navigator.share({ files:[file] }).then(function(){
              label.textContent = "저장 창을 띄웠습니다 — 비디오 저장을 누르세요";
            }).catch(function(e){
              if(e && e.name === "AbortError") return;
              label.textContent = "저장 창을 열지 못했습니다 (" + (e && e.name ? e.name : "오류") + ") — 파일로 받기를 쓰세요";
            });
          };
          saveline.appendChild(sb);
        }
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = fname;
        a.textContent = canShare ? "파일로 받기" : "파일로 받기 (파일 앱 다운로드)";
        saveline.appendChild(a);

        var x = document.createElement("button");
        x.textContent = "닫기"; x.type = "button";
        x.style.cssText = "margin-left:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 14px;color:var(--ink)";
        x.onclick = function(){ saveline.hidden = true; URL.revokeObjectURL(url); };
        saveline.appendChild(x);
        saveline.hidden = false;
      };
      mediaRec.start(1000);
      recStart = performance.now();
      $("record").textContent = "녹화 중지";
      $("record").classList.add("recording");
      showNotice("녹화를 시작했습니다. 멈추면 저장 줄이 뜹니다.");
    }catch(e){
      stick("녹화를 시작하지 못했습니다 (" + (e && e.name ? e.name : "오류") + "). 이 기기는 웹 녹화를 지원하지 않습니다 — 카메라 앱으로 따로 찍어 주세요.");
    }
  }
  function stopRecording(){
    try{
      if(mediaRec && mediaRec.state === "recording"){ mediaRec.stop(); showNotice("녹화를 멈췄습니다. 아래 저장 줄을 보세요."); }
    }catch(e){ stick("녹화를 멈추는 중 오류 (" + (e && e.name ? e.name : "오류") + ")"); }
    $("record").textContent = "녹화";
    $("record").classList.remove("recording");
  }

  /* ---------- 화면 전환 ---------- */
  function openStage(){
    state.text = script.value; save();
    buildWords(state.text);
    applyStageStyle();
    requestAnimationFrame(measure);
    offset = 0; target = 0; accum = 0; cursor = -1;
    place(); setup.hidden = true; stage.hidden = false;
    saveline.hidden = true;
    requestAnimationFrame(function(){ measure(); updateClock(); });
    if(state.camOn){ startCam().catch(function(){}); } else { applyScrim(); }
    if(state.mode === "voice") showNotice("마이크 사용을 물으면 허용해 주세요. 말하는 대로 따라갑니다.");
    if(state.countIn) runCountIn(); else play();
  }
  function runCountIn(){
    var n = 3;
    countdown.hidden = false; countdown.textContent = n;
    var iv = setInterval(function(){
      n--;
      if(n<=0){ clearInterval(iv); countdown.hidden = true; play(); }
      else countdown.textContent = n;
    }, 1000);
  }
  function closeStage(){
    pause(); releaseWake(); stopCam();
    stage.hidden = true; setup.hidden = false;
    updateCounts();
  }

  /* ---------- 연결 ---------- */
  load(); syncSetupUI(); applyScrim();
  if(!recSupported()) $("record").hidden = true;

  /* 열린 환경을 먼저 알린다 — 앱 안 브라우저는 카메라·마이크가 막힌다 */
  (function envCheck(){
    var hasCam = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    var w = $("warn");
    if(inApp() || !hasCam || !voiceSupported){
      var msg = "";
      if(inApp()){
        msg = "<b>지금 앱 안에 뜬 화면에서 보고 계십니다.</b> 텔레그램·카카오톡 같은 앱 안 화면은 카메라와 마이크를 막습니다. 오른쪽 위 공유 버튼을 눌러 <b>사파리로 열기</b>(안드로이드는 크롬)를 선택해 주세요. 그러면 카메라와 음성 따라가기가 작동합니다.";
      }else{
        msg = "이 브라우저에서 " + (!hasCam ? "카메라" : "") + (!hasCam && !voiceSupported ? "와 " : "") + (!voiceSupported ? "음성 인식" : "") + "을 쓸 수 없습니다. 사파리나 크롬에서 열어 주세요. 주소가 https 가 아니어도 막힙니다.";
      }
      w.innerHTML = msg; w.hidden = false;
    }
  })();

  $("selftest").addEventListener("click", function(){
    var out = $("checkResult");
    out.textContent = "확인 중…"; out.className = "sub";
    var lines = [];
    lines.push("주소 보안: " + (window.isSecureContext ? "정상(https)" : "아님 — 카메라 불가"));
    lines.push("음성 인식: " + (voiceSupported ? "있음" : "없음"));
    var mrOk = (typeof MediaRecorder !== "undefined");
    lines.push("녹화 기능: " + (mrOk ? "있음 (" + (pickMime() || "기본 형식") + ")" : "없음 — 이 기기/브라우저는 녹화를 못 합니다"));
    var shareOk = !!(navigator.share && navigator.canShare);
    lines.push("사진첩 저장(공유): " + (shareOk ? "있음" : "없음 — 파일로 받기만 됩니다"));
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      lines.push("카메라·마이크: 쓸 수 없는 화면입니다 (사파리나 크롬에서 열어 주세요)");
      out.textContent = lines.join(" / "); out.className = "sub bad"; return;
    }
    navigator.mediaDevices.getUserMedia({ video:true, audio:true }).then(function(st){
      var v = st.getVideoTracks().length, a = st.getAudioTracks().length;
      st.getTracks().forEach(function(t){ t.stop(); });
      lines.push("카메라: " + (v?"정상":"없음") + " / 마이크: " + (a?"정상":"없음"));
      out.textContent = lines.join(" / ");
      out.className = "sub " + (v&&a&&mrOk ? "ok" : "bad");
    }).catch(function(err){
      lines.push("카메라·마이크 허용 안 됨 (" + (err && err.name ? err.name : "오류") + ")");
      out.textContent = lines.join(" / "); out.className = "sub bad";
    });
  });

  function bindRange(id, key, fmtFn){
    $(id).addEventListener("input", function(){
      state[key] = parseInt(this.value,10);
      $(id+"Val").textContent = fmtFn(state[key]);
      updateCounts(); applyStageStyle(); if(!stage.hidden) measure(); save();
    });
  }
  bindRange("size","size",function(v){return v+"px";});
  bindRange("speed","speed",function(v){return String(v);});
  bindRange("lead","lead",function(v){return (v/10).toFixed(1);});
  bindRange("guide","guide",function(v){return v+"%";});
  $("scrim").addEventListener("input", function(){
    state.scrim = parseInt(this.value,10);
    $("scrimVal").textContent = state.scrim+"%";
    applyScrim(); save();
  });

  ["mirrorX","mirrorY","countIn","keepAwake"].forEach(function(id){
    $(id).addEventListener("click", function(){
      state[id] = !state[id];
      this.setAttribute("aria-pressed", String(state[id]));
      applyStageStyle(); save();
    });
  });
  $("camOn").addEventListener("click", function(){
    state.camOn = !state.camOn;
    this.setAttribute("aria-pressed", String(state.camOn));
    save();
    if(!stage.hidden){ state.camOn ? startCam().catch(function(){}) : stopCam(); }
  });
  $("camBack").addEventListener("click", function(){
    if(!stage.hidden){ flipCam(); return; }
    state.camBack = !state.camBack;
    this.setAttribute("aria-pressed", String(state.camBack));
    save();
  });
  $("camToggle").addEventListener("click", function(){
    state.camOn = !state.camOn;
    $("camOn").setAttribute("aria-pressed", String(state.camOn));
    save();
    state.camOn ? startCam().catch(function(){}) : stopCam();
  });
  $("flip").addEventListener("click", flipCam);
  $("record").addEventListener("click", function(){
    (mediaRec && mediaRec.state === "recording") ? stopRecording() : startRecording();
  });
  $("modeVoice").addEventListener("click", function(){ if(!voiceSupported) return; setMode("voice"); });
  $("modeAuto").addEventListener("click", function(){ setMode("auto"); });
  function setMode(m){
    state.mode = m;
    $("modeVoice").setAttribute("aria-pressed", String(m==="voice"));
    $("modeAuto").setAttribute("aria-pressed", String(m==="auto"));
    $("modeToggle").textContent = (m==="voice" ? "모드: 음성" : "모드: 속도");
    $("modeNow").innerHTML = (m==="voice" ? "<b>내가 말하면 따라옴</b>" : "<b>정해진 속도로 올라감</b>");
    updateCounts(); save();
  }
  $("modeToggle").addEventListener("click", function(){
    if(state.mode === "auto" && !voiceSupported){
      stick("이 브라우저는 음성 인식을 지원하지 않습니다. 사파리나 크롬에서 열어 주세요.");
      return;
    }
    var next = (state.mode === "voice") ? "auto" : "voice";
    setMode(next);
    if(next === "voice"){
      cursor = -1;
      for(var i=0;i<words.length;i++){ words[i].el.className = ""; }
      if(running) startRec(); else showNotice("시작을 누르고 소리 내어 읽으시면 글이 따라갑니다.");
    }else{
      stopRec();
    }
  });
  function nudgeScrim(d){
    state.scrim = Math.min(90, Math.max(0, state.scrim + d));
    $("scrim").value = state.scrim; $("scrimVal").textContent = state.scrim + "%";
    applyScrim(); save();
    showNotice("가림막 " + state.scrim + "%");
  }
  $("moreBtn").addEventListener("click", function(){
    var m = $("moreRow");
    m.hidden = !m.hidden;
    this.textContent = m.hidden ? "더보기" : "접기";
  });
  function updateDiag(){
    var diagLine = $("diagLine");
    var sinceHeard = lastHeard ? ((performance.now()-lastHeard)/1000).toFixed(1) : "—";
    var heardWords = lastToks.length ? lastToks.join(" ") : "—";
    var micBusy = (camStream && camStream.getAudioTracks()[0] && camStream.getAudioTracks()[0].readyState === "live") ? "녹화중" : "자유";
    diagLine.textContent = "세션 " + recSessions + " · 종료 " + onendCount + " · 되살림 " + reviveCount + " · 마지막에러 " + (lastErrorName || "—") +
      " · 마지막들림 " + sinceHeard + "초전 · 들은말 " + heardWords +
      " · 커서 " + (cursor+1) + "/" + words.length + " · 마이크 " + micBusy;
  }
  $("diagToggle").addEventListener("click", function(){
    diagOn = !diagOn;
    this.setAttribute("aria-pressed", String(diagOn));
    $("diagLine").hidden = !diagOn;
    if(diagOn){
      updateDiag();
      diagTimer = setInterval(updateDiag, 500);
    }else{
      clearInterval(diagTimer); diagTimer = 0;
    }
  });
  $("brighter").addEventListener("click", function(){ nudgeScrim(-10); });
  $("darker").addEventListener("click", function(){ nudgeScrim(10); });

  $("start").addEventListener("click", openStage);
  $("playPause").addEventListener("click", function(){ running ? pause() : play(); });
  $("slower").addEventListener("click", function(){ nudgeSpeed(-1); });
  $("faster").addEventListener("click", function(){ nudgeSpeed(1); });
  $("restart").addEventListener("click", resetPos);
  $("exit").addEventListener("click", closeStage);

  function resetPos(){
    offset = 0; target = 0; accum = 0; cursor = -1;
    for(var i=0;i<words.length;i++){ words[i].el.className = ""; }
    place(); updateClock();
  }
  function nudgeSpeed(d){
    state.speed = Math.min(15, Math.max(1, state.speed + d));
    $("speed").value = state.speed; $("speedVal").textContent = state.speed;
    updateClock(); save();
  }

  var dragging=false, startY=0, startOffset=0;
  viewport.addEventListener("pointerdown", function(e){
    if(!countdown.hidden) return;
    dragging = true; startY = e.clientY; startOffset = offset;
    try{ viewport.setPointerCapture(e.pointerId); }catch(err){}
  });
  viewport.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var dy = e.clientY - startY;
    offset = Math.max(0, startOffset - dy*(state.mirrorY?-1:1));
    target = offset;
    place(); updateClock();
  });
  viewport.addEventListener("pointerup", function(){ dragging=false; });
  viewport.addEventListener("pointercancel", function(){ dragging=false; });

  document.addEventListener("keydown", function(e){
    if(stage.hidden){
      if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); openStage(); }
      return;
    }
    if(e.key===" "){ e.preventDefault(); running?pause():play(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); nudgeSpeed(1); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); nudgeSpeed(-1); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); offset += pxPerSec()*10; target = offset; place(); updateClock(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); offset = Math.max(0, offset - pxPerSec()*10); target = offset; place(); updateClock(); }
    else if(e.key==="r"||e.key==="R"){ resetPos(); }
    else if(e.key==="Escape"){ closeStage(); }
  });

  window.addEventListener("resize", function(){
    if(!stage.hidden){ measure(); aimAtCursor(); updateClock(); }
    else updateCounts();
  });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="visible" && running) requestWake();
  });
})();
</script>
</body>
</html>
