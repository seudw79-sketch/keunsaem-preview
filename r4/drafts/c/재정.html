function b2a(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function unlock(){
  var pw=document.getElementById("pw").value; if(!pw)return;
  document.getElementById("err").textContent="";
  try{
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2a(SALT),iterations:200000,hash:"SHA-256"},
             km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},key,b2a(CT));
    document.open();document.write(new TextDecoder().decode(pt));document.close();
  }catch(e){document.getElementById("err").textContent="암호가 맞지 않습니다";}
}
document.getElementById("go").addEventListener("click",unlock);
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()});
