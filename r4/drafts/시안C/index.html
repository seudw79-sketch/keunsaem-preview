<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>[시안C] 큰샘교회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
<!-- 본문 글꼴 — CSS 스택에 Pretendard 를 적어놓고 정작 불러오지 않아 기기 기본 글꼴로 보이던 것을 고침
     (워커 s56 지적 2026-09-30 · 맥에선 애플 고딕으로 가려져 안 보였고 윈도·안드로이드에서 드러난다)
     SIL Open Font License 1.1 — 조건 없음 -->
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
/* 시안C · 도록(카탈로그) — 작품집을 펼친 느낌
   근거: 미술관 도록 문법(번호 라벨·얇은 괘선·작품 정보표) + 비대칭 그리드(codex 조사 '쓸 수 있다')
   사진 출처가 달라도 모노톤으로 묶으면 한 권처럼 읽힌다 */
:root{
  --paper:#F4F2ED; --ink:#1A1C1E; --muted:#74777C; --rule:#D8D5CE;
  --serif:"Noto Serif KR",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --gut:clamp(20px,5vw,56px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;letter-spacing:-.01em;word-break:keep-all}
a{color:inherit}
img{display:block;max-width:100%;height:auto}

.hd{display:flex;align-items:baseline;justify-content:space-between;
    padding:22px var(--gut) 18px;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.logo{font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:.02em;text-decoration:none}
.nav{display:flex;gap:clamp(12px,2vw,26px);font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.nav a{text-decoration:none}

/* 판면 — 왼쪽 도판 2/3 · 오른쪽 정보 1/3, 사이에 괘선 */
.spread{display:grid;grid-template-columns:1.72fr 1fr;
        border-bottom:1px solid var(--rule)}
@media(max-width:820px){.spread{grid-template-columns:1fr}}
.plateL{padding:clamp(26px,4vh,52px) clamp(18px,3vw,44px);border-right:1px solid var(--rule)}
@media(max-width:820px){.plateL{border-right:0;border-bottom:1px solid var(--rule)}}
.plateL img{width:100%;border-radius:0;
  filter:grayscale(1) sepia(.13) contrast(1.02);   /* 도록 모노톤 — 출처가 달라도 한 권으로 묶인다 */
  box-shadow:0 10px 26px -18px rgba(0,0,0,.4)}
.plateL figcaption{margin-top:14px;font-size:12.5px;color:var(--muted)}

.plateR{padding:clamp(26px,4vh,52px) var(--gut) clamp(26px,4vh,52px) clamp(18px,3vw,36px);
        display:flex;flex-direction:column;justify-content:center}
.no{font-size:12.5px;letter-spacing:.14em;color:var(--muted)}
.label{margin-top:6px;font-size:13.5px;letter-spacing:.05em;color:var(--muted)}
.title{font-family:var(--serif);font-weight:400;font-size:clamp(25px,3.1vw,40px);
       line-height:1.32;letter-spacing:-.02em;margin-top:12px;
       word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.verse{font-family:var(--serif);font-weight:300;font-size:clamp(14px,1.4vw,17px);color:var(--muted);margin-top:12px}
.actions{margin-top:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;
     border:1px solid var(--ink);border-radius:9999px;font-size:14px;text-decoration:none;
     transition:background .18s ease,color .18s ease}
.btn:hover{background:var(--ink);color:var(--paper)}
.more{font-size:13.5px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:2px}

/* 작품 정보표 — 미술관 라벨 문법 그대로 */
.meta{margin-top:clamp(22px,3vh,36px);border-top:1px solid var(--rule);padding-top:16px;
      font-size:13px;line-height:1.9}
.meta div{display:grid;grid-template-columns:76px 1fr;gap:10px}
.meta dt{color:var(--muted)}

/* 도판 목록 — 작은 번호 붙은 그리드 */
.plates{padding:clamp(30px,5vh,64px) var(--gut);border-bottom:1px solid var(--rule)}
.plates h2{font-size:12.5px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.grid{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(14px,2.4vw,30px)}
.grid figure img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center;
                 border-radius:0;filter:grayscale(1) sepia(.13) contrast(1.02)}
.grid figcaption{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6}
.grid .n{letter-spacing:.12em}

.ft{padding:22px var(--gut) 44px;font-size:12.5px;color:var(--muted);
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (prefers-reduced-motion: no-preference){
  @supports (animation-timeline: view()){
    .grid figure{animation:fade linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  }
}
</style>
</head>
<body>

<header class="hd">
  <a class="logo" href="./">큰샘교회</a>
  <nav class="nav">
    <a href="#">교회소개</a><a href="#">예배안내</a><a href="#">새가족</a>
    <a href="#">성경 아카데미</a><a href="#">온라인 주보</a><a href="#">칼럼</a>
  </nav>
</header>

<section class="spread">
  <figure class="plateL">
    <img src="img/art22.jpg" width="2400" height="1769" alt="피터르 브뤼헐, 추수하는 사람들, 1565">
    <figcaption>도판 01 · 피터르 브뤼헐, 『추수하는 사람들』, 1565</figcaption>
  </figure>

  <div class="plateR">
    <p class="no">No. 01</p>
    <p class="label">이번 주일 · 9월 27일</p>
    <h1 class="title">광야에서도 신실하신 하나님</h1>
    <p class="verse">민수기 14장 8-9절</p>
    <div class="actions">
      <a class="btn" href="https://www.youtube.com/watch?v=4Uw236eEFuk" target="_blank" rel="noopener">설교 영상 보기</a>
      <a class="more" href="#">지난 설교</a>
    </div>

    <dl class="meta">
      <div><dt>주일예배</dt><dd>오전 11시</dd></div>
      <div><dt>성경공부</dt><dd>주일 오후 1시</dd></div>
      <div><dt>아침예배</dt><dd>오전 7시</dd></div>
      <div><dt>오시는 길</dt><dd>경기도 광명시 기아로 23, 4층 (소하동)</dd></div>
    </dl>
  </div>
</section>

<section class="plates">
  <h2>도판 목록</h2>
  <div class="grid">
    <figure>
      <img src="img/art27.jpg" width="2400" height="2178" alt="와타나베 시코(渡辺始興), 산수, 18세기 전반">
      <figcaption><span class="n">02</span> · 와타나베 시코(渡辺始興), 『산수』, 18세기 전반</figcaption>
    </figure>
    <figure>
      <img src="img/art10.jpg" width="2400" height="1422" alt="쥘 뒤프레, 여울을 건너는 소 떼">
      <figcaption><span class="n">03</span> · 쥘 뒤프레, 『여울을 건너는 소 떼』, 1836</figcaption>
    </figure>
    <figure>
      <img src="img/art19.jpg" width="2400" height="1992" alt="야코프 판 라위스달, 밀밭">
      <figcaption><span class="n">04</span> · 야코프 판 라위스달, 『밀밭』</figcaption>
    </figure>
    <figure>
      <img src="img/art21.jpg" width="2400" height="2036" alt="야코프 마리스(Jacob Maris), 레이스베이크의 네덜란드 운하, 19세기 후반">
      <figcaption><span class="n">05</span> · 야코프 마리스(Jacob Maris), 『레이스베이크의 네덜란드 운하』, 19세기 후반</figcaption>
    </figure>
  </div>
</section>

<footer class="ft">
  <span>큰샘교회 · 도판은 모두 메트로폴리탄미술관 공개 소장품(Public Domain)</span>
  <span>[시안C · 도록형] 내부 검토용</span>
</footer>

</body>
</html>
